# Base theme for the btctrace console. The heavy lifting is CSS in btctrace/ui.py; this
# exists so Streamlit's own widgets (inputs, tables, tabs, the dataframe grid) start from
# the same palette instead of fighting it. Keep these in step with the surface constants
# at the top of btctrace/ui.py: parchment ground, white panels, Action Blue, near-black
# ink. No font files are referenced -- the stacks in ui.py are system fonts, so the
# dashboard renders identically on an air-gapped machine.
[theme]
base = "light"
primaryColor = "#0066cc"
backgroundColor = "#f5f5f7"
secondaryBackgroundColor = "#ffffff"
textColor = "#1d1d1f"
font = "sans-serif"

[server]
headless = true
